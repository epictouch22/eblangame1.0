(function () {
  if (new URLSearchParams(location.search).get('eblan') !== '1' || window.parent === window) return;

  let currentPeers = [];
  let joined = false;
  let connecting = false;
  function send(kind, extra) {
    window.parent.postMessage(Object.assign({ type: 'space_gta:child', kind: kind }, extra || {}), location.origin);
  }
  const room = {
    onPeers(fn) { callbacks.peers.add(fn); fn({ peers: currentPeers }); return () => callbacks.peers.delete(fn); },
    on(kind, fn) {
      if (!callbacks[kind]) return () => {};
      callbacks[kind].add(fn);
      return () => callbacks[kind].delete(fn);
    },
    presence(data) { send('presence', { data: data }); return Promise.resolve(); },
    emit(kind, data) {
      if (kind === 'chat') for (const fn of callbacks.chat) fn({ data: data, isMe: true });
      if (['chat', 'bh', 'bk'].includes(kind)) send('event', { event: kind, data: data });
      return Promise.resolve();
    },
    leave() { joined = false; send('leave'); return Promise.resolve(); }
  };
  window.claude = {
    use: async (kind) => kind === 'room'
      ? { join: async () => room }
      : kind === 'user' ? { me: async () => ({ name: 'Пилот' }) } : null
  };
  window.addEventListener('message', async (e) => {
    if (e.origin !== location.origin || e.source !== window.parent || !e.data) return;
    const msg = e.data;
    if (msg.type === 'space_gta:init') {
      if (joined || connecting || !/^[0-9]{3}$/.test(String(msg.code))) return;
      connecting = true;
      try {
        await window.__sgtaNetReady;
        await netJoin(String(msg.code), String(msg.nick || 'Пилот').slice(0, 14));
        joined = NET.on;
        if (joined && !started) startGame();
      } finally { connecting = false; }
    } else if (msg.type === 'space_gta:peers') {
      currentPeers = (Array.isArray(msg.peers) ? msg.peers : []).slice(0, 9)
        .map((p) => ({ peer: String(p.id), isMe: false, kind: 'viewer', presence: p.presence || {} }));
      for (const fn of callbacks.peers) fn({ peers: currentPeers });
    } else if (msg.type === 'space_gta:event' && callbacks[msg.event]) {
      for (const fn of callbacks[msg.event]) fn({ data: msg.data, isMe: false });
    }
  });
  window.__sgtaNotifyReady = () => send('ready');
})();
